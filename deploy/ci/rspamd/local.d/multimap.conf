# CI ONLY. Gives the integration test a message that scores between add_header and reject,
# which no stock rule does on demand (GTUBE jumps straight to reject). Do not copy this file
# into a deployment.
CI_SPAM_PROBE {
  type = "header";
  header = "X-CI-Spam-Probe";
  regexp = true;
  map = "/etc/rspamd/local.d/ci_spam_probe.map";
  score = 8.0;
  description = "Integration-test probe";
}
