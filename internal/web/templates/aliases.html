{{define "aliases"}}{{template "head" .}}
<details class="card add"{{if or (not .Data) .IsErr}} open{{end}}><summary>Add an alias</summary>
<form method="post" action="/aliases/add">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="al-address">Alias address</label>
<input id="al-address" name="address" type="email" autocapitalize="none" autocomplete="off" required>
<label for="al-targets">Deliver to (comma-separated)</label>
<input id="al-targets" name="targets" autocapitalize="none" autocomplete="off" required>
<button type="submit">Add alias</button>
</form>
</details>
{{if .Data}}<div class="scroll"><table class="list">
<thead><tr><th>Alias</th><th>Delivers to</th></tr></thead>
<tbody>{{range .Data}}<tr><td><a href="/aliases/edit?address={{.Address}}">{{.Address}}</a></td><td class="wrap">{{join .Targets ", "}}</td></tr>
{{end}}</tbody>
</table></div>{{else}}<p>No aliases.</p>{{end}}
{{template "foot" .}}{{end}}
