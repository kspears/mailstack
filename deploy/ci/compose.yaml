# Reference stack for the integration test (deploy/ci/test.sh), and the shape a deployment
# copies. Every image is pinned by tag AND digest; docs/UPGRADING.md says how to move a pin.
#
# Nothing is published to the host: the test talks to the stack from a container on the
# compose network. A deployment adds `ports:` to postfix (25, 465, 587) and dovecot (993)
# and to nothing else. Dovecot's SASL (12345) and LMTP (24) listeners and rspamd's milter
# (11332) are unauthenticated and rely on the network being private. rspamd's controller
# (11334) takes a password but still must not be published.
#
# The state volume holds store.db (every password hash) and the DKIM keys next to the files
# the daemons read, so postfix, which faces the internet, and dovecot mount only the
# subdirectories they need: `generations` read-only, and for postfix `watcher` read-write
# (the one place its watcher writes). Neither container can see store.db or the key directory,
# so a compromise of either cannot read or replace them. `subpath` needs Docker Engine 26 and
# Compose 2.23 or newer.
name: mailstack-ci

services:
  # Docker creates named volumes root-owned, and the dovecot image has no chown. Mail is
  # owned by uid 5000 (mail_uid in dovecot.conf). A volume `subpath` must exist when the
  # container starts, so this also creates the two state subdirectories mailctl makes itself.
  init:
    image: mailstack-postfix:ci
    pull_policy: never # built by the postfix service below
    entrypoint:
      - sh
      - -c
      - chown 5000:5000 /var/vmail /var/vmail_index && mkdir -p /state/generations /state/watcher
    volumes:
      - vmail:/var/vmail
      - vmail_index:/var/vmail_index
      - state:/state
    restart: "no"

  # The admin image is distroless, so it cannot `cp`; mailctl copies itself instead. The
  # binary is what dovecot's Sieve scripts pipe messages to (`mailctl learn spam|ham`).
  learn-bin:
    image: mailstack-admin:ci
    pull_policy: never # built by the admin service below, which owns the build
    entrypoint: ["mailctl", "install-self", "/sieve/bin"]
    volumes:
      - sieve_bin:/sieve/bin
    restart: "no"

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The resolver postfix (postscreen's blocklists) and rspamd ask. Fixed address because
  # `dns:` takes an address, not a name.
  unbound:
    image: mailstack-unbound:ci
    build: ../../images/unbound
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      default:
        ipv4_address: 10.254.76.53

  rspamd:
    image: rspamd/rspamd:4.3.0@sha256:0d89891908f93ab1ce53c17fa90430130b48ad720216192ec44e646997c0a8e1
    depends_on:
      redis:
        condition: service_healthy
      unbound:
        condition: service_healthy
    dns: [10.254.76.53]
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      # Generated by test.sh: the controller password. Never committed.
      - ./.keys/rspamd:/etc/rspamd/secrets:ro
    # On `edge` for its web UI only (11334, behind the proxy and mailctl's gate).
    networks: [default, edge]

  dovecot:
    image: dovecot/dovecot:2.4.5-root@sha256:e4e02686612ef57bce02ada4771e4a46dab7592e3e0498cccfcf2227138e26a9
    depends_on:
      init:
        condition: service_completed_successfully
      learn-bin:
        condition: service_completed_successfully
    volumes:
      - ./dovecot:/etc/dovecot:ro
      # Read-only, and only the generated files: dovecot never reads store.db or the DKIM keys.
      - type: volume
        source: state
        target: /data/mailstack/generations
        read_only: true
        volume:
          subpath: generations
      # `mailctl learn` is the Sieve pipe program. This image has no shell tools, so the static
      # binary itself is what dovecot runs; learn-bin put it in this volume.
      - sieve_bin:/sieve/bin:ro
      - ./.keys/rspamd/controller-password:/run/secrets/rspamd-controller-password:ro
      - vmail:/var/vmail
      - vmail_index:/var/vmail_index
      - ./.keys/tls:/etc/ssl/mailstack:ro
      - ./.keys/mail_crypt:/mail_crypt:ro
    tmpfs:
      - /var/volatile:uid=5000,gid=5000,mode=0700

  postfix:
    image: mailstack-postfix:ci
    build: ../../images/postfix
    depends_on:
      init:
        condition: service_completed_successfully
      dovecot:
        condition: service_started
      rspamd:
        condition: service_started
      unbound:
        condition: service_healthy
    dns: [10.254.76.53]
    volumes:
      - ./postfix/main.cf:/etc/postfix/main.cf:ro
      - ./postfix/master.cf:/etc/postfix/master.cf:ro
      - ./.keys/tls:/etc/ssl/mailstack:ro
      - type: volume
        source: state
        target: /data/mailstack/generations
        read_only: true
        volume:
          subpath: generations
      # Read-write: the one place the watcher writes (its verdict on a pending generation).
      - type: volume
        source: state
        target: /data/mailstack/watcher
        volume:
          subpath: watcher
      - postfix_queue:/var/spool/postfix

  # `docker compose run --rm -T admin mailbox add ...`. Never mounts the Docker socket.
  admin:
    image: mailstack-admin:ci
    build:
      context: ../..
      dockerfile: images/admin/Dockerfile
    profiles: [tools]
    environment: &mailctl_env
      MAILCTL_STATE: /data/mailstack
      MAILCTL_MAIL_ROOT: /var/vmail
      # Also needed on the command line: an enrolment link names the hostname.
      MAILCTL_ADMIN_HOST: admin.example.test
    volumes:
      - state:/data/mailstack
      - vmail:/var/vmail
      - vmail_index:/var/vmail_index

  # The admin UI. Plain HTTP on the `edge` network only, never published: the proxy is the
  # one way in. It is not on the mail network, so it cannot reach dovecot's or rspamd's
  # unauthenticated listeners; it needs only the files.
  ui:
    image: mailstack-admin:ci
    pull_policy: never # built by the admin service above
    command: ["serve"]
    environment:
      <<: *mailctl_env
      MAILCTL_RSPAMD_HOST: rspamd.example.test
      # The proxy's fixed address, the only one allowed to say who the visitor is.
      MAILCTL_TRUSTED_PROXY: 10.254.77.2
    volumes:
      - state:/data/mailstack
      - vmail:/var/vmail:ro
    networks: [edge]

  # The web front door: ends TLS and routes by hostname. A deployment publishes 443 here
  # and nowhere else. The aliases stand in for DNS so the test can use the real hostnames.
  proxy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on: [ui, rspamd]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        ipv4_address: 10.254.77.2
        aliases: [admin.example.test, rspamd.example.test]

  # Test client living on the compose network. Not part of a deployment.
  probe:
    image: python:3.15.2-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
    profiles: [tools]
    entrypoint: ["python", "-I", "/probe.py"]
    networks: [default, edge]
    volumes:
      - ./probe.py:/probe.py:ro
      - ./webprobe.py:/webprobe.py:ro
      - ./.keys/tls/tls.crt:/ca.crt:ro
      - ./.keys/rspamd/controller-password:/rspamd-controller-password:ro

networks:
  # A fixed subnet so unbound can have the fixed address postfix and rspamd are pointed at.
  default:
    ipam:
      config:
        - subnet: 10.254.76.0/24
          ip_range: 10.254.76.128/25
  # The web side. A fixed subnet so the proxy can have a fixed address for the UI to trust.
  edge:
    ipam:
      config:
        - subnet: 10.254.77.0/24
          # Addresses Docker hands out by itself come from the upper half, so a container
          # started earlier can never be sitting on the proxy's fixed one.
          ip_range: 10.254.77.128/25

volumes:
  state:
  sieve_bin:
  vmail:
  vmail_index:
  postfix_queue:
  redis:
