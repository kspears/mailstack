{{define "mailboxes"}}{{template "head" .}}
<details class="card add"{{if not .Data}} open{{end}}><summary>Add a mailbox</summary>
<form method="post" action="/mailboxes/add">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="a-address">Address</label>
<input id="a-address" name="address" type="email" autocapitalize="none" autocomplete="off" required>
<label for="a-name">Display name</label>
<input id="a-name" name="name" autocomplete="off">
<label for="a-pw">Password</label>
<input id="a-pw" name="password" type="password" autocomplete="new-password" required>
<label for="a-pw2">Password again</label>
<input id="a-pw2" name="password2" type="password" autocomplete="new-password" required>
<button type="submit">Add mailbox</button>
<button class="plain" type="submit" name="generate" value="1" formnovalidate>Generate a password instead</button>
</form>
</details>
{{if .Data}}<div class="scroll"><table class="list">
<thead><tr><th>Address</th><th>Name</th><th>State</th><th>Last delivery</th><th>Size</th></tr></thead>
<tbody>{{range .Data}}<tr><td><a href="/mailboxes/edit?address={{.Address}}">{{.Address}}</a></td><td>{{.Name}}</td><td>{{.State}}</td><td{{if .Err}} class="bad"{{end}}>{{.Delivery}}</td><td>{{.Size}}</td></tr>
{{end}}</tbody>
</table></div>{{else}}<p>No mailboxes.</p>{{end}}
{{template "foot" .}}{{end}}
