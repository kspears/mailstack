# X-Spam: Yes is what dovecot's global Sieve script files into Junk. The milter proxy adds it
# when the action is "add header" (see spam_header in worker-proxy.inc); the routines below add
# the human-readable score headers.
use = ["x-spam-level", "x-spam-status", "authentication-results"];
authenticated_headers = ["authentication-results"];
extended_spam_headers = true;
skip_local = false;
skip_authenticated = false;
