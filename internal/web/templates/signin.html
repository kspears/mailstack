{{define "signin"}}{{template "head" .}}
<div class="card">
<button type="button" data-passkey="get" data-begin="/signin/passkey/begin" data-finish="/signin/passkey/finish" data-next="/status" data-csrf="{{.CSRF}}">Sign in with a passkey</button>
<p id="passkey-status" class="muted" role="status"></p>
</div>
<h2>Or with your password</h2>
<form class="card" method="post" action="/signin">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="si-address">Admin address</label>
<input id="si-address" name="address" type="email" autocomplete="username" required>
<label for="si-pw">Password</label>
<input id="si-pw" name="password" type="password" autocomplete="current-password" required>
<label for="si-code">Code from your authenticator app</label>
<input id="si-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required>
<button type="submit">Sign in</button>
</form>
{{template "foot" .}}{{end}}
{{define "enrol_gone"}}{{template "head" .}}
<p>This enrolment link has been used, replaced or has expired. Ask the server's operator for a new one.</p>
{{template "foot" .}}{{end}}
