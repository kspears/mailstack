# Weekly update PRs. Minor and patch updates come as one PR per ecosystem; a major
# version comes on its own. A release is proposed only once it is a week old, so a
# compromised version has time to be pulled before it reaches a PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  # The images' base layers, pinned by tag and digest.
  - package-ecosystem: docker
    directories: [/images/admin, /images/postfix, /images/unbound]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        update-types: [minor, patch]

  # The third-party service images (caddy, dovecot, redis, rspamd), pinned in the CI
  # stack so each bump runs the integration test. The live pins are in kspears/iac and are
  # moved by hand once a bump here merges.
  - package-ecosystem: docker-compose
    directory: /deploy/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      service-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
