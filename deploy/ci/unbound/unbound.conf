# The reference stack's resolver. A deployment copies this and narrows access-control to
# its mail network; CI adds one local name so test.sh can prove postfix asks this resolver.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    # Only the compose networks may ask. Never publish port 53.
    access-control: 0.0.0.0/0 refuse
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    # The container is the jail: no chroot. unbound drops to the package's unprivileged
    # user after binding, and logs to stderr for `docker logs`.
    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1
    hide-identity: yes
    hide-version: yes
    # From dns-root-data: no network fetch, no writable anchor file.
    root-hints: "/usr/share/dns/root.hints"
    trust-anchor-file: "/usr/share/dns/root.key"
    qname-minimisation: yes
    prefetch: yes

    # CI only: a name test.sh resolves from inside postfix to prove the wiring.
    local-zone: "unbound.test." static
    local-data: "probe.unbound.test. A 192.0.2.53"
