# Replaces the image's whole /etc/dovecot (the directory is mounted, so the image's conf.d
# is not read). Validate any change with:
#   docker run --rm -v "$PWD/deploy/ci/dovecot:/etc/dovecot:ro" --entrypoint doveconf \
#     dovecot/dovecot:<pinned tag> -n
# The image has no cat, ls or curl, and its sh is all there is, so nothing here relies on
# in-container scripts.

dovecot_config_version = 2.4.3
# Oldest on-disk format any rollback target can read. Raise it only after the version it
# names can no longer be a rollback target (see docs/UPGRADING.md).
dovecot_storage_version = 2.3.0

base_dir = /run/dovecot
state_dir = /run/dovecot
protocols = imap lmtp
log_path = /dev/stdout

# --- Mail storage ---------------------------------------------------------------------------
# One system user owns every mailbox; virtual users are rows in the passwd-file.
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000

mail_driver = maildir
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir
# Indexes live outside the mail volume so they can be dropped and rebuilt, and kept off
# whatever backs up mail. Volatile files never need to survive a restart.
mail_index_path = /var/vmail_index/%{user}
mail_volatile_path = /var/volatile/%{user}
# Folder names are mapped onto filenames; keep "." out of the on-disk names.
mailbox_list_storage_escape_char = "\\"

namespace inbox {
  inbox = yes
  separator = /

  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
    # Spam and deleted mail are not worth the indexing work or the index size.
    fts_autoindex = no
    # Moving a message into Junk trains rspamd on it as spam.
    sieve_script report_spam {
      type = before
      cause = copy
      driver = file
      path = /etc/dovecot/sieve/report-spam.sieve
      bin_path = /var/volatile/sieve-report-spam.svbin
    }
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
    fts_autoindex = no
  }
}

# --- At-rest protection: compression, then encryption with one site-wide key pair -----------
mail_plugins {
  mail_compress = yes
  mail_crypt = yes
  fts = yes
  fts_flatcurve = yes
}
mail_compress_write_method = lz4
# The key pair is mounted at run time; CI generates a throwaway one. The private key must be
# PKCS#8 ("BEGIN PRIVATE KEY"); an "EC PRIVATE KEY" file is rejected.
crypt_global_public_key_file = /mail_crypt/ecpubkey.pem
crypt_global_private_key main {
  crypt_private_key_file = /mail_crypt/ecprivkey.pem
}

# --- Full text search -----------------------------------------------------------------------
fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes
language_filters = normalizer-icu snowball stopwords
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple
language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}
fts flatcurve {
  substring_search = yes
  commit_limit = 100
}

# --- Authentication -------------------------------------------------------------------------
# Passwords come from the file mailctl regenerates. Caching would keep serving a changed or
# removed account's old hash until the TTL ran out; with a flat file the lookup is cheap.
auth_cache_size = 0
auth_mechanisms = plain login
# Cleartext mechanisms are only acceptable because every listener that carries them
# requires TLS (ssl = required below; postfix offers AUTH only after STARTTLS or on 465).
auth_username_format = %{user | lower}

passdb passwd-file {
  passwd_file_path = /data/mailstack/generations/current/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /data/mailstack/generations/current/dovecot/users
}

# --- TLS ------------------------------------------------------------------------------------
ssl = required
ssl_server {
  cert_file = /etc/ssl/mailstack/tls.crt
  key_file = /etc/ssl/mailstack/tls.key
}
ssl_min_protocol = TLSv1.2

# --- Listeners ------------------------------------------------------------------------------
service imap-login {
  inet_listener imap {
    # No cleartext IMAP at all.
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}

# 12345 (SASL for postfix) and 24 (LMTP) are plaintext, unauthenticated protocols. They are
# safe only because the compose network is private and neither port is published. Never
# add them to a `ports:` list.
service auth {
  inet_listener sasl {
    port = 12345
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# --- Sieve: spam goes to Junk, and moving mail in or out of Junk trains rspamd ---------------
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
sieve_script spam {
  type = before
  driver = file
  path = /etc/dovecot/sieve/spam.sieve
  # The script directory is mounted read-only and lmtp runs as the mail user, who cannot write
  # /run/dovecot, so the compiled binary goes on the mail-user-owned tmpfs.
  bin_path = /var/volatile/sieve-spam.svbin
}

# Junk training. IMAPSieve runs the two scripts in /etc/dovecot/sieve when a user moves a message
# into Junk (spam, in the Junk mailbox block above) or out of it (ham, below). Each one pipes the
# message to `mailctl learn` from /sieve/bin, which posts it to rspamd's controller. Sieve starts
# the program with an empty environment, so it uses its defaults: http://rspamd:11334 and the
# password in the file /run/secrets/rspamd-controller-password, so the password is never on a
# command line.
protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}
sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}
sieve_global_extensions {
  vnd.dovecot.pipe = yes
}
sieve_pipe_bin_dir = /sieve/bin
# The pipe program is a Go binary. It inherits the imap process's address-space limit (256M
# by default) and the Go runtime reserves more virtual memory than that at startup, so it dies
# with "failed to reserve page summary memory". It does not use the memory, only reserves it.
service imap {
  vsz_limit = 2G
}
imapsieve_from Junk {
  sieve_script report_ham {
    type = before
    cause = copy
    driver = file
    path = /etc/dovecot/sieve/report-ham.sieve
    bin_path = /var/volatile/sieve-report-ham.svbin
  }
}
