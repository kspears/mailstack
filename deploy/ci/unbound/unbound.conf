# The reference stack's resolver. A deployment copies this, sets access-control to its own
# mail network, and drops the CI-only block at the end.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    # Only the compose network may ask (localhost is allowed by default). Never publish
    # port 53.
    access-control: 0.0.0.0/0 refuse
    access-control: 10.254.76.0/24 allow
    # The container is the jail: no chroot. unbound drops to the package's unprivileged
    # user after binding, and logs to stderr for `docker logs`.
    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1
    hide-identity: yes
    hide-version: yes
    # From dns-root-data, fixed at image build: a root key change arrives only with a new
    # image (docs/UPGRADING.md).
    root-hints: "/usr/share/dns/root.hints"
    trust-anchor-file: "/usr/share/dns/root.key"
    qname-minimisation: yes
    prefetch: yes

    # CI only, not for a deployment: a name test.sh resolves from inside postfix and rspamd
    # to prove they ask this resolver.
    local-zone: "unbound.test." static
    local-data: "probe.unbound.test. A 192.0.2.53"

# The image's healthcheck runs `unbound-control status`. Localhost only, no certificates.
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
