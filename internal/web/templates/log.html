{{define "log"}}{{template "head" .}}
{{if .Data}}<table>
<thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Subject</th></tr></thead>
<tbody>{{range .Data}}<tr><td>{{stamp .Time}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td>{{.Subject}}</td></tr>{{end}}</tbody>
</table>{{else}}<p>No changes yet.</p>{{end}}
{{template "foot" .}}{{end}}
